name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (inclusi golden test fiscali)
        run: pnpm test

      - name: Privacy gate (nessun dato personale reale)
        env:
          PRIVACY_BLOCKLIST: ${{ secrets.PRIVACY_BLOCKLIST }}
        run: node scripts/check-privacy.mjs
