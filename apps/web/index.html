<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partitiva</title>
    <meta
      name="description"
      content="Gestione open source e privacy-first della Partita IVA in regime forfettario"
    />
    <link rel="icon" href="/icona.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <script>
      // Anti-flash: applica il tema salvato PRIMA del primo paint. Replica la lettura di
      // src/lib/tema.ts (stessa chiave): se cambi lì, cambia anche qui. Se storage o
      // matchMedia mancano si parte chiari; il toggle rimedia al mount.
      try {
        var tema = localStorage.getItem('partitiva-tema')
        var scuro = tema === 'scuro' || (tema !== 'chiaro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', scuro)
      } catch (errore) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
